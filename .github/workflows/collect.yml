name: Daily collect

# Runs the collector on a schedule and commits the refreshed database back to
# the repo. Streamlit Community Cloud redeploys on push, so the app always shows
# fresh numbers — no computer of yours needs to be on.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (~8-9am ET). Change if you like.
  workflow_dispatch: {}      # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated database

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect snapshots
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python collect.py

      - name: Commit refreshed data
        run: |
          git config user.name "prodkpc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/growth.db
          git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
